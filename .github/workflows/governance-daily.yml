name: governance-daily
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python .scripts/repoctl.py scheduled daily-drift
