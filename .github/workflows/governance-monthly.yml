name: governance-monthly
on:
  schedule:
    - cron: '47 5 1 * *'
  workflow_dispatch:
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python .scripts/repoctl.py scheduled monthly-governance-review
